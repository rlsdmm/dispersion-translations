<body>
  <div id="topo"></div>

  <section class="carrossel" id="carrossel" aria-roledescription="carrossel" aria-label="Destaques">
    <div class="car-trilho" id="carTrilho"></div>
    <button class="car-seta ant" id="carAnt" aria-label="Destaque anterior">‹</button>
    <button class="car-seta prox" id="carProx" aria-label="Próximo destaque">›</button>
    <div class="car-pontos" id="carPontos"></div>
  </section>

  <main class="wrap">
    <section id="continuarSec" hidden>
      <div class="titulo-sec"><h2>Continuar lendo</h2><a class="sub" href="biblioteca.html">Minha biblioteca →</a></div>
      <div class="lancamentos" id="listaCont"></div>
    </section>

    <section id="lancamentos">
      <div class="titulo-sec"><h2>Últimos lançamentos</h2></div>
      <div class="lancamentos" id="listaLanc"></div>
    </section>

    <section id="popularesSec" hidden>
      <div class="titulo-sec"><h2>Populares do mês</h2></div>
      <div class="pop-top" id="listaPop"></div>
      <ol class="pop-resto" id="listaPopResto"></ol>
    </section>

    <div id="metaMes" class="meta-home" hidden></div>

    <section id="generosSec" hidden>
      <div class="titulo-sec"><h2>Explorar por gênero</h2></div>
      <div class="generos-grade" id="listaGeneros"></div>
    </section>

    <section id="rankingSec" hidden>
      <div class="titulo-sec"><h2>Ranking dos leitores</h2><a class="sub" href="conta.html">quem tem mais XP · ver o seu →</a></div>
      <ol class="podio" id="listaRanking"></ol>
    </section>

    <section id="obras">
      <div class="titulo-sec">
        <h2>Obras</h2>
        <div class="ferramentas">
          <select class="seletor" id="genero" aria-label="Filtrar por gênero"><option value="">Todos os gêneros</option></select>
          <select class="seletor" id="ordem" aria-label="Ordenar">
            <option value="az">A–Z</option>
            <option value="recentes">Atualizadas</option>
            <option value="caps">Mais capítulos</option>
          </select>
          <input class="busca" id="busca" type="search" placeholder="Buscar por título ou autor…" />
        </div>
      </div>
      <div class="filtros" id="filtros"></div>
      <div class="grade" id="grade"></div>
    </section>

    <section id="sobre">
      <div class="sobre">
        <div>
          <h2>Sobre o grupo</h2>
          <p id="descricao"></p>
        </div>
        <div class="links" id="links"></div>
      </div>
    </section>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/app.js?v=11"></script>
  <script>
    const { D, esc, capa, capsOrdenados, ultimoCap, tempoRelativo, header, footer } = DT;
    document.getElementById("topo").innerHTML = header("inicio");
    document.getElementById("rodape").innerHTML = footer();
    document.getElementById("descricao").textContent = D.grupo.descricao;
    document.getElementById("links").innerHTML = D.grupo.links
      .map((l) => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.nome)} →</a>`).join("");


    /* ---------- carrossel ---------- */
    function montarCarrossel(itens) {
      const trilho = document.getElementById("carTrilho"), pontos = document.getElementById("carPontos");
      const car = document.getElementById("carrossel");
      if (!itens.length) { car.hidden = true; return; }
      trilho.innerHTML = itens.map(({ s, data, c }, i) => {
        const novo = (Date.now() - new Date(data + "T12:00:00")) / 864e5 < 7;
        const ler = DT.continuar(s) || { cap: capsOrdenados(s)[0], rotulo: "Começar a ler" };
        const href = `serie.html?s=${encodeURIComponent(s.id)}`;
        return `<article class="car-slide ${i ? "" : "on"}" data-i="${i}" data-sid="${esc(s.id)}" aria-hidden="${i ? "true" : "false"}">
          <div class="car-fundo" style="background-image:url('${capa(s)}')"></div>
          <div class="wrap car-conteudo">
            <a class="car-capa" href="${href}" tabindex="-1"><img src="${capa(s)}" alt="${esc(s.titulo)}" ${i ? 'loading="lazy"' : ""} /></a>
            <div class="car-info">
              <div class="car-selos">
                ${novo ? '<span class="selo-car novo">✦ Capítulo novo</span>' : ""}
                <span class="selo-car">${esc(s.status || "")}</span>
                ${(s.generos || []).slice(0, 2).map((g) => `<span class="selo-car leve">${esc(g)}</span>`).join("")}
              </div>
              <h2><a href="${href}">${esc(s.titulo)}</a></h2>
              ${s.tituloOriginal ? `<p class="car-orig">${esc(s.tituloOriginal)}</p>` : ""}
              <p class="car-meta">
                <span>📚 ${s.capitulos.length} ${s.capitulos.length === 1 ? "capítulo" : "capítulos"}</span>
                <span>🆕 Cap. ${c.numero} · ${tempoRelativo(data)}</span>
                ${s.autor ? `<span>✍️ ${esc(s.autor)}</span>` : ""}
                <span class="car-leituras" hidden></span>
              </p>
              <p class="car-sinopse">${esc(s.sinopse || "")}</p>
              <div class="botoes">
                ${ler.cap ? `<a class="btn pri" href="ler.html?s=${encodeURIComponent(s.id)}&c=${ler.cap.numero}">📖 ${esc(ler.rotulo || "Ler agora")}</a>` : ""}
                <a class="btn" href="${href}">Detalhes</a>
              </div>
            </div>
          </div>
        </article>`;
      }).join("");
      pontos.innerHTML = itens.map((_, i) => `<button class="${i ? "" : "on"}" data-i="${i}" aria-label="Destaque ${i + 1}"></button>`).join("");
      const slides = [...trilho.children];
      let atual = 0, timer = null;
      function ir(i) {
        atual = (i + slides.length) % slides.length;
        slides.forEach((el, k) => { el.classList.toggle("on", k === atual); el.setAttribute("aria-hidden", k === atual ? "false" : "true"); });
        [...pontos.children].forEach((b, k) => b.classList.toggle("on", k === atual));
        const prox = slides[(atual + 1) % slides.length].querySelector("img");
        if (prox) prox.removeAttribute("loading");
        reiniciar();
      }
      function reiniciar() {
        clearTimeout(timer);
        if (slides.length > 1 && !matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setTimeout(() => ir(atual + 1), 7000);
      }
      document.getElementById("carAnt").onclick = () => ir(atual - 1);
      document.getElementById("carProx").onclick = () => ir(atual + 1);
      pontos.onclick = (e) => { const b = e.target.closest("button"); if (b) ir(+b.dataset.i); };
      car.addEventListener("mouseenter", () => clearTimeout(timer));
      car.addEventListener("mouseleave", reiniciar);
      document.addEventListener("visibilitychange", () => document.hidden ? clearTimeout(timer) : reiniciar());
      // arrastar no celular
      let x0 = null;
      car.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; clearTimeout(timer); }, { passive: true });
      car.addEventListener("touchend", (e) => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 40) ir(atual + (dx < 0 ? 1 : -1)); else reiniciar();
      });
      if (slides.length < 2) { car.classList.add("unico"); }
      reiniciar();
    }

    // leituras do mês nos destaques
    function leiturasNoCarrossel(top) {
      for (const { s, n } of top) {
        const el = document.querySelector(`.car-slide[data-sid="${CSS.escape(s.id)}"] .car-leituras`);
        if (el) { el.textContent = `👁 ${n} ${n === 1 ? "leitura" : "leituras"} no mês`; el.hidden = false; }
      }
    }

    DT.iniciar(() => {
    DT.metaDoMes(document.getElementById("metaMes"), { compacta: true });
    // continuar lendo (com conta: ordem do histórico; sem conta: o que está no navegador)
    const ordem = [...new Set(DT.conta.historico.map((h) => h.serie_id))];
    const emAndamento = D.series
      .filter((s) => DT.lidos.ultimo(s.id) != null)
      .map((s) => ({ s, c: DT.continuar(s) }))
      .filter(({ s, c }) => c && !(c.cap === ultimoCap(s) && DT.lidos.foiLido(s.id, c.cap.numero)))
      .sort((a, b) => (ordem.indexOf(a.s.id) + 1 || 1e9) - (ordem.indexOf(b.s.id) + 1 || 1e9))
      .slice(0, 4);
    if (emAndamento.length) {
      document.getElementById("continuarSec").hidden = false;
      document.getElementById("listaCont").innerHTML = emAndamento.map(({ s, c }) => {
        const novos = DT.novosDesde(s).length;
        return `<a class="lanc" href="ler.html?s=${encodeURIComponent(s.id)}&c=${c.cap.numero}">
          <img src="${capa(s)}" alt="" loading="lazy" />
          <div class="info">
            <h3>${esc(s.titulo)}</h3>
            <span class="cap">${esc(c.rotulo)}${novos ? `<span class="novo">${novos} ${novos === 1 ? "NOVO" : "NOVOS"}</span>` : ""}</span>
            <span class="quando">${(DT.lidos.todos()[s.id] || []).length} de ${s.capitulos.length} lidos</span>
          </div></a>`;
      }).join("");
    }

    // últimos lançamentos: uma entrada por obra (a mais recente), pra uma obra não tomar a lista toda
    const recentes = D.series
      .map((s) => {
        const caps = s.capitulos.filter((c) => c.data);
        if (!caps.length) return null;
        const data = caps.reduce((m, c) => (c.data > m ? c.data : m), "");
        const doDia = caps.filter((c) => c.data === data).sort((a, b) => a.numero - b.numero);
        return { s, data, doDia, c: doDia[doDia.length - 1] };
      })
      .filter(Boolean)
      .sort((a, b) => b.data.localeCompare(a.data) || b.c.numero - a.c.numero);
    const todosRecentes = recentes.splice(0); // lista completa (o carrossel filtra dela)
    recentes.push(...todosRecentes.slice(0, 9));

    // carrossel de destaques: as obras com lançamento mais recente, só obras que o grupo ainda está levando (sem "Cancelado")
    const FORA_DO_DESTAQUE = ["Cancelado"];
    montarCarrossel(todosRecentes.filter((r) => !FORA_DO_DESTAQUE.includes(r.s.status)).slice(0, 8));

    const ehNovo = (d) => d && (Date.now() - new Date(d + "T12:00:00")) / 864e5 < 7;
    document.getElementById("listaLanc").innerHTML = recentes.map(({ s }) => {
      const href = `serie.html?s=${encodeURIComponent(s.id)}`;
      const ultimos = capsOrdenados(s).slice(-2).reverse();
      return `<div class="lanc2">
        <a class="l2-capa" href="${href}" tabindex="-1"><img src="${capa(s)}" alt="" loading="lazy" /></a>
        <div class="l2-info">
          <div class="l2-topo">${(s.generos || [])[0] ? `<span class="l2-gen">${esc(s.generos[0])}</span>` : ""}<span class="sub">${s.capitulos.length} caps</span></div>
          <a class="l2-titulo" href="${href}" title="${esc(s.titulo)}">${esc(s.titulo)}</a>
          ${ultimos.map((c) => `<a class="l2-cap" href="ler.html?s=${encodeURIComponent(s.id)}&c=${c.numero}">
            <b>Cap. ${c.numero}</b>${ehNovo(c.data) ? '<span class="novo">NOVO</span>' : ""}${c.vip ? '<span class="cap-vip">VIP</span>' : ""}
            <span class="quando">${c.data ? tempoRelativo(c.data) : ""}</span></a>`).join("")}
        </div>
      </div>`;
    }).join("");

    // populares do mês (leituras dos últimos 30 dias)
    if (DT.sb) DT.sb.rpc("populares", { p_dias: 30, p_limite: 50 }).then(({ data }) => {
      const top = (data || []).map((p) => ({ s: DT.serie(p.serie_id), n: Number(p.leituras) })).filter((p) => p.s && p.n > 0);
      leiturasNoCarrossel(top);
      if (top.length < 3) return;
      top.splice(10);
      document.getElementById("popularesSec").hidden = false;
      const leit = (n) => `👁 ${n} ${n === 1 ? "leitura" : "leituras"}`;
      document.getElementById("listaPop").innerHTML = top.slice(0, 3).map(({ s, n }, i) => {
        const u = ultimoCap(s);
        return `<a class="pop-card r${i + 1}" href="serie.html?s=${encodeURIComponent(s.id)}">
          <span class="pc-fundo" style="background-image:url('${capa(s)}')"></span>
          <span class="pc-num">${i + 1}</span>
          <img src="${capa(s)}" alt="" loading="lazy" />
          <span class="pc-info">
            <span class="pc-gen">${esc((s.generos || [])[0] || s.status || "")}</span>
            <b class="pc-titulo">${esc(s.titulo)}</b>
            <span class="pc-meta">${u ? "Cap. " + u.numero : ""}${s.autor ? " · " + esc(s.autor) : ""}</span>
            <span class="pc-leit">${leit(n)}</span>
          </span>
        </a>`;
      }).join("");
      document.getElementById("listaPopResto").innerHTML = top.slice(3).map(({ s, n }, i) => `
        <li><a class="pop-mini" href="serie.html?s=${encodeURIComponent(s.id)}">
          <span class="pm-capa"><img src="${capa(s)}" alt="" loading="lazy" /><span class="pm-num">${i + 4}</span></span>
          <b>${esc(s.titulo)}</b>
          <small>${leit(n)}</small>
        </a></li>`).join("");
    });

    // grade de obras com busca e filtro por status
    const ORDEM_STATUS = ["Em andamento", "Completo", "Hiato", "Pausado pelo grupo", "Cancelado", "Sem staff"];
    const statusUsados = ORDEM_STATUS.filter((st) => D.series.some((s) => s.status === st))
      .concat([...new Set(D.series.map((s) => s.status))].filter((st) => st && !ORDEM_STATUS.includes(st)));
    let filtroStatus = "";
    const classeStatus = (st) => ({ "Completo": "completo", "Em andamento": "andamento", "Cancelado": "cancelado",
      "Pausado pelo grupo": "pausado", "Hiato": "pausado", "Sem staff": "semstaff" })[st] || "";
    document.getElementById("filtros").innerHTML = ["", ...statusUsados].map((st) =>
      `<button type="button" class="chip ${st ? "" : "on"}" data-st="${esc(st)}">${st ? esc(st) : "Todas"}
        <small>${st ? D.series.filter((s) => s.status === st).length : D.series.length}</small></button>`).join("");
    document.getElementById("filtros").addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      filtroStatus = b.dataset.st;
      document.querySelectorAll("#filtros .chip").forEach((x) => x.classList.toggle("on", x === b));
      renderGrade(document.getElementById("busca").value);
    });

    // gêneros (com quantas obras cada um tem) e ordenação
    const contGen = {};
    D.series.forEach((s) => (s.generos || []).forEach((g) => (contGen[g] = (contGen[g] || 0) + 1)));
    const selGen = document.getElementById("genero"), selOrdem = document.getElementById("ordem");
    selGen.insertAdjacentHTML("beforeend", Object.keys(contGen).sort((a, b) => a.localeCompare(b, "pt"))
      .map((g) => `<option value="${esc(g)}">${esc(g)} (${contGen[g]})</option>`).join(""));
    const ultimaData = (s) => s.capitulos.reduce((m, c) => (c.data > m ? c.data : m), "");
    const ORDENS = {
      az: (a, b) => a.titulo.localeCompare(b.titulo, "pt"),
      recentes: (a, b) => ultimaData(b).localeCompare(ultimaData(a)) || a.titulo.localeCompare(b.titulo, "pt"),
      caps: (a, b) => b.capitulos.length - a.capitulos.length || a.titulo.localeCompare(b.titulo, "pt"),
    };
    try { selOrdem.value = localStorage.getItem("ordemObras") || "az"; } catch {}
    if (!ORDENS[selOrdem.value]) selOrdem.value = "az";
    selGen.addEventListener("change", () => renderGrade(document.getElementById("busca").value));

    // explorar por gênero: os gêneros com mais obras, cada um com a capa de uma obra diferente
    const usadas = new Set();
    const topGen = Object.entries(contGen).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 10);
    if (topGen.length >= 4) {
      document.getElementById("generosSec").hidden = false;
      document.getElementById("listaGeneros").innerHTML = topGen.map(([g, n]) => {
        const s = D.series.filter((x) => (x.generos || []).includes(g) && !usadas.has(x.id))
          .sort((a, b) => b.capitulos.length - a.capitulos.length)[0];
        if (s) usadas.add(s.id);
        return `<button type="button" class="genero-bloco" data-gen="${esc(g)}">
          ${s ? `<img src="${capa(s)}" alt="" loading="lazy" />` : ""}
          <span class="g-nome">${esc(g)}</span><span class="g-n">${n} obras</span></button>`;
      }).join("");
      document.getElementById("listaGeneros").onclick = (e) => {
        const b = e.target.closest(".genero-bloco"); if (!b) return;
        selGen.value = b.dataset.gen; selGen.dispatchEvent(new Event("change"));
        document.getElementById("obras").scrollIntoView({ behavior: "smooth" });
      };
    }

    // pódio de leitores (quem tem mais XP)
    if (DT.sb) DT.sb.rpc("top_xp", { p_limite: 5 }).then(({ data }) => {
      const top = data || [];
      if (top.length < 3) return;
      document.getElementById("rankingSec").hidden = false;
      const medalha = ["🥇", "🥈", "🥉"];
      document.getElementById("listaRanking").innerHTML = top.map((u, i) => `
        <li class="podio-${i + 1}">
          <span class="pos">${medalha[i] || i + 1}</span>
          <a href="${DT.linkPerfil(u.user_id)}" class="podio-link">${DT.avatar(u.apelido, u.user_id, "grande")}
          <b class="${u.vip ? "nome-vip" : ""}">${esc(u.apelido)}</b></a>
          ${u.equipe ? '<span class="selo-equipe">Equipe</span>' : u.vip ? '<span class="selo-vip">VIP</span>' : ""}
          <span class="sub">${DT.nivel(u.xp).emoji} ${DT.nivel(u.xp).nome} · ${Number(u.xp).toLocaleString("pt-BR")} XP</span>
        </li>`).join("");
    });
    selOrdem.addEventListener("change", () => {
      try { localStorage.setItem("ordemObras", selOrdem.value); } catch {}
      renderGrade(document.getElementById("busca").value);
    });

    function renderGrade(filtro = "") {
      const f = filtro.trim().toLowerCase();
      const gen = selGen.value;
      const lista = D.series.filter((s) => (!filtroStatus || s.status === filtroStatus) &&
        (!gen || (s.generos || []).includes(gen)) && (!f ||
        [s.titulo, s.tituloOriginal, ...(s.nomesAlt || []), s.autor, ...(s.generos || [])].join(" ").toLowerCase().includes(f)))
        .sort(ORDENS[selOrdem.value] || ORDENS.az);
      document.getElementById("grade").innerHTML = lista.length ? lista.map((s) => {
        const u = ultimoCap(s);
        return `<a class="obra" href="serie.html?s=${encodeURIComponent(s.id)}">
          <div class="capa"><img src="${capa(s)}" alt="${esc(s.titulo)}" loading="lazy" />
            <span class="selo ${classeStatus(s.status)}">${esc(s.status)}</span></div>
          <h3>${esc(s.titulo)}</h3>
          <div class="meta">${[u ? "Cap. " + u.numero : "Em breve", esc((s.generos || [])[0] || "")].filter(Boolean).join(" · ")}</div>
        </a>`;
      }).join("") : `<p class="vazio">Nenhuma obra encontrada.</p>`;
    }
    renderGrade();
    document.getElementById("busca").addEventListener("input", (e) => renderGrade(e.target.value));
    if (!D.series.length) document.getElementById("listaLanc").innerHTML = `<p class="vazio">Nenhum capítulo publicado ainda.</p>`;
    });
  </script>
