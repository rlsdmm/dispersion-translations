<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada · Dispersion Translations</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" href="icone-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#070b16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&amp;display=swap" />
  <link rel="stylesheet" href="css/style.css?v=38" />
  <link rel="stylesheet" href="css/temas.css?v=10" />
  <script>try{var q=new URLSearchParams(location.search).get("tema");if(q!==null)localStorage.setItem("dt:tema",JSON.stringify(q));localStorage.removeItem("tema-previa");var t=JSON.parse(localStorage.getItem("dt:tema")||"null");if(t&&t!=="padrao"&&t!=="azul"){document.documentElement.dataset.tema=t;document.write('<link rel="stylesheet" id="fontesTemas" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Space+Grotesk:wght@400;600;700&amp;family=Nunito:wght@400;600;800;900&amp;family=Oswald:wght@500;700&amp;family=Rubik:wght@400;500;700&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap">')}}catch(e){}</script>
</head>
<body>
  <div id="topo"></div>
  <main class="wrap nao-achou">
    <div class="grande">404</div>
    <h1>Essa página não existe 😵</h1>
    <p class="sub">O link pode estar errado ou a página mudou de lugar.</p>
    <div class="acoes">
      <a class="btn pri" href="index.html">Ir pro início</a>
      <a class="btn" href="index.html#obras">Ver todas as obras</a>
    </div>
  </main>
  <div id="rodape"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/app.js?v=16"></script>
  <script>
    // obra/<id>.html que ainda não foi gerada (obra recém-cadastrada): abre a versão normal da página
    (function () {
      const m = location.pathname.match(/^\/obra\/([a-z0-9-]+?)(?:\.html)?\/?$/);
      if (m) location.replace("/serie.html?s=" + m[1] + "&novo=1" + location.hash);
    })();
  </script>
  <script>
    document.getElementById("topo").innerHTML = DT.header();
    document.getElementById("rodape").innerHTML = DT.footer();
  </script>
</body>
</html>
