<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obra · Dispersion Translations</title>
  <meta name="description" content="Leia mangás traduzidos para o português de graça na Dispersion Translations: Black Paradox, Houseki no Kuni, Yuusha ga Shinda!, Hinowa ga Yuku! e muito mais, feitos por fãs." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Dispersion Translations" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Dispersion Translations" />
  <meta property="og:description" content="Leia mangás traduzidos para o português de graça na Dispersion Translations: Black Paradox, Houseki no Kuni, Yuusha ga Shinda!, Hinowa ga Yuku! e muito mais, feitos por fãs." />
  <meta property="og:image" content="https://dispersiontl.com.br/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@DispersionTL" />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" href="icone-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#070b16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&amp;display=swap" />
  <link rel="stylesheet" href="css/style.css?v=19" />
  <link rel="stylesheet" href="css/temas.css?v=6" />
  <script>try{var q=new URLSearchParams(location.search).get("tema");if(q!==null)localStorage.setItem("dt:tema",JSON.stringify(q));localStorage.removeItem("tema-previa");var t=JSON.parse(localStorage.getItem("dt:tema")||"null");if(t&&t!=="padrao"&&t!=="azul"){document.documentElement.dataset.tema=t;document.write('<link rel="stylesheet" id="fontesTemas" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Space+Grotesk:wght@400;600;700&amp;family=Nunito:wght@400;600;800;900&amp;family=Oswald:wght@500;700&amp;family=Rubik:wght@400;500;700&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap">')}}catch(e){}</script>
</head>
<body>
  <div id="topo"></div>
  <div id="conteudo"></div>
  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/app.js?v=8"></script>
  <script>
    const { esc, serie, capa, capsOrdenados, dataBR, lidos, header, footer, store, conta, continuar } = DT;
    document.getElementById("topo").innerHTML = header();
    document.getElementById("rodape").innerHTML = footer();

    DT.iniciar(() => {
    const id = new URLSearchParams(location.search).get("s");
    const s = serie(id);
    const el = document.getElementById("conteudo");

    if (!s) {
      el.innerHTML = `<div class="wrap"><p class="erro-pag">Obra não encontrada. <a href="index.html" style="color:var(--acc)">Voltar ao início</a></p></div>`;
    } else {
      document.title = `${s.titulo} em Português | Ler Mangá Online · Dispersion Translations`;
      // descrição e prévia de link da obra (Google, Discord, WhatsApp...)
      const meta = (sel, attr, v) => { let m = document.head.querySelector(sel); if (!m) { m = document.createElement(sel.startsWith("link") ? "link" : "meta"); const [, k, n] = sel.match(/\[(\w+)="([^"]+)"/); m.setAttribute(k, n); document.head.appendChild(m); } m.setAttribute(attr, v); };
      const url = `https://dispersiontl.com.br/serie.html?s=${encodeURIComponent(s.id)}`;
      const alt = (s.nomesAlt || []).find((n) => /^[\x20-\x7EÀ-ÿ’]+$/.test(n) && n.length <= 60);
      const descMeta = `Ler ${s.titulo}${alt ? ` (${alt})` : ""} em português (PT-BR), online e grátis. Mangá${s.autor ? " de " + s.autor : ""} traduzido por fãs, ${capsOrdenados(s).length} ${capsOrdenados(s).length === 1 ? "capítulo" : "capítulos"}. ${(s.sinopse || "").replace(/\s+/g, " ")}`.slice(0, 320);
      meta('meta[name="description"]', "content", descMeta);
      meta('meta[property="og:title"]', "content", `${s.titulo} · Dispersion Translations`);
      meta('meta[property="og:description"]', "content", descMeta);
      meta('meta[property="og:url"]', "content", url);
      meta('link[rel="canonical"]', "href", url);
      meta('meta[property="og:image"]', "content", capa(s));
      // dados estruturados (Google entende que é uma série de mangá, com nomes alternativos)
      const ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org", "@type": "ComicSeries", name: s.titulo, url,
        alternateName: [s.tituloOriginal, ...(s.nomesAlt || [])].filter(Boolean),
        author: s.autor ? s.autor.split(/,\s*/).map((n) => ({ "@type": "Person", name: n })) : undefined,
        genre: s.generos, image: capa(s), description: s.sinopse, inLanguage: "pt-BR",
        publisher: { "@type": "Organization", name: "Dispersion Translations", url: "https://dispersiontl.com.br/" },
      });
      document.head.appendChild(ld);
      const caps = capsOrdenados(s);
      const cont = continuar(s);

      el.innerHTML = `
        <div class="serie-topo">
          <div class="fundo" style="background-image:url('${capa(s)}')"></div>
          <div class="wrap">
            <img class="capa-g" src="${capa(s)}" alt="${esc(s.titulo)}" />
            <div>
              <h1>${esc(s.titulo)}</h1>
              ${s.tituloOriginal ? `<div class="original">${esc(s.tituloOriginal)} · ${esc(s.autor || "")}</div>` : ""}
              ${(s.nomesAlt || []).length ? `<div class="nomes-alt"><span>Também conhecido como</span> ${s.nomesAlt.map(esc).join(" · ")}</div>` : ""}
              <div class="tags">
                <span class="tag status">${esc(s.status)}</span>
                ${(s.generos || []).map((g) => `<span class="tag">${esc(g)}</span>`).join("")}
              </div>
              <p class="sinopse">${esc(s.sinopse || "")}</p>
              <div class="botoes">
                ${cont ? `<a class="btn pri" href="ler.html?s=${encodeURIComponent(s.id)}&c=${cont.cap.numero}">${esc(cont.rotulo)}</a>` : ""}
                ${caps.length > 1 ? `<a class="btn" href="ler.html?s=${encodeURIComponent(s.id)}&c=${caps[caps.length - 1].numero}">Último capítulo</a>` : ""}
                ${DT.sb ? `<button class="btn fav" id="fav"></button>` : ""}
              </div>
              <p class="contagens" id="contagens"></p>
            </div>
          </div>
        </div>
        <main class="wrap">
          <div class="abas abas-serie" id="abas" hidden>
            <button data-aba="caps" class="on">Capítulos <small>${caps.length}</small></button>
            <button data-aba="capas">Capas <small id="nCapas"></small></button>
          </div>
          <section class="aba" id="aba-caps">
            <div class="titulo-sec">
              <h2 id="tituloCaps">Capítulos (${caps.length})</h2>
              <button class="btn ordem" id="ordem"></button>
            </div>
            <div class="lista-caps" id="lista"></div>
          </section>
          <section class="aba" id="aba-capas" hidden>
            <div class="grade-vol" id="gradeVol"></div>
          </section>
        </main>
        <div class="visor" id="visor" hidden>
          <button class="visor-x" aria-label="Fechar">✕</button>
          <button class="visor-seta ant" aria-label="Capa anterior">‹</button>
          <figure><img alt="" /><figcaption></figcaption></figure>
          <button class="visor-seta prox" aria-label="Próxima capa">›</button>
        </div>`;

      let desc = store.get("ordemDesc", true);
      function renderLista() {
        // capítulos antecipados que a pessoa ainda não pode ler aparecem com cadeado
        const todosCaps = [...caps, ...(s.antecipados || []).map((a) => ({ ...a, travado: true }))].sort((a, b) => a.numero - b.numero);
        const l = desc ? [...todosCaps].reverse() : todosCaps;
        const libera = (c) => { const d = Math.max(0, Math.ceil((new Date(c.publicoEm) - Date.now()) / 864e5)); return d <= 1 ? "libera amanhã" : `libera em ${d} dias`; };
        document.getElementById("ordem").textContent = desc ? "↓ Mais novos" : "↑ Mais antigos";
        document.getElementById("lista").innerHTML = l.length ? l.map((c) => c.travado ? `
          <a href="apoie.html#vip" class="cap-travado" title="Capítulo antecipado para apoiadores VIP">
            <span><span class="n">🔒 Capítulo ${c.numero}</span><span class="cap-vip">VIP</span><span class="t">${libera(c)} pra todo mundo</span></span>
            <span class="d">${dataBR(c.data)}</span>
          </a>` : `
          <a href="ler.html?s=${encodeURIComponent(s.id)}&c=${c.numero}" class="${lidos.foiLido(s.id, c.numero) ? "lido" : ""}">
            <span><span class="n">Capítulo ${c.numero}</span>${c.vip ? '<span class="cap-vip">VIP</span>' : ""}${c.titulo ? `<span class="t">${esc(c.titulo)}</span>` : ""}</span>
            <span class="d">${dataBR(c.data)}</span>
          </a>`).join("") : `<p class="vazio">Nenhum capítulo ainda. Em breve!</p>`;
      }
      document.getElementById("ordem").onclick = () => { desc = !desc; store.set("ordemDesc", desc); renderLista(); };
      renderLista();

      // capas dos volumes (dados/volumes.json, gerado por ferramentas/volumes.py)
      fetch("dados/volumes.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})).then((todos) => {
        const vols = todos[s.id] || [];
        if (!vols.length) return;
        document.getElementById("abas").hidden = false;
        document.getElementById("tituloCaps").hidden = true;
        document.getElementById("nCapas").textContent = vols.length;
        document.getElementById("gradeVol").innerHTML = vols.map((v, i) => `
          <button type="button" class="vol" data-i="${i}">
            <img src="${esc(v.url)}" alt="${esc(s.titulo)} volume ${esc(v.v)}" loading="lazy" />
            <span>Volume ${esc(v.v)}</span>
          </button>`).join("");

        const abas = document.querySelectorAll("#abas button");
        function abrirAba(nome) {
          abas.forEach((b) => b.classList.toggle("on", b.dataset.aba === nome));
          document.getElementById("aba-caps").hidden = nome !== "caps";
          document.getElementById("aba-capas").hidden = nome !== "capas";
        }
        abas.forEach((b) => (b.onclick = () => {
          abrirAba(b.dataset.aba);
          history.replaceState(null, "", b.dataset.aba === "capas" ? "#capas" : location.pathname + location.search);
        }));
        if (location.hash === "#capas") abrirAba("capas");

        // visor em tela cheia, com setas e teclado
        const visor = document.getElementById("visor"), img = visor.querySelector("img"), leg = visor.querySelector("figcaption");
        let atual = 0;
        const mostrar = (i) => {
          atual = (i + vols.length) % vols.length;
          img.src = vols[atual].url;
          img.alt = `${s.titulo} volume ${vols[atual].v}`;
          leg.textContent = `Volume ${vols[atual].v} · ${atual + 1} de ${vols.length}`;
        };
        const fechar = () => { visor.hidden = true; document.body.style.overflow = ""; };
        document.getElementById("gradeVol").onclick = (e) => {
          const b = e.target.closest(".vol");
          if (!b) return;
          mostrar(+b.dataset.i);
          visor.hidden = false;
          document.body.style.overflow = "hidden";
        };
        visor.onclick = (e) => {
          if (e.target.closest(".ant")) mostrar(atual - 1);
          else if (e.target.closest(".prox")) mostrar(atual + 1);
          else if (e.target === visor || e.target.closest(".visor-x")) fechar();
        };
        document.addEventListener("keydown", (e) => {
          if (visor.hidden) return;
          if (e.key === "Escape") fechar();
          if (e.key === "ArrowLeft") mostrar(atual - 1);
          if (e.key === "ArrowRight") mostrar(atual + 1);
        });
        let x0 = null;
        visor.addEventListener("touchstart", (e) => (x0 = e.touches[0].clientX), { passive: true });
        visor.addEventListener("touchend", (e) => {
          if (x0 == null) return;
          const dx = e.changedTouches[0].clientX - x0;
          if (Math.abs(dx) > 50) mostrar(atual + (dx < 0 ? 1 : -1));
          x0 = null;
        });
      });

      // favoritar
      const fav = document.getElementById("fav");
      function renderFav() {
        const sim = conta.favoritos.has(s.id);
        fav.classList.toggle("on", sim);
        fav.innerHTML = sim ? "♥ Favoritado" : "♡ Favoritar";
        fav.title = sim ? "Tirar dos favoritos" : "Adicionar à sua biblioteca e ser avisado de capítulos novos";
      }
      if (fav) {
        renderFav();
        fav.onclick = async () => {
          if (!conta.user) return (location.href = conta.linkEntrar());
          fav.disabled = true;
          try { await conta.favoritar(s.id, !conta.favoritos.has(s.id)); } catch (e) { alert("Não deu pra salvar: " + e.message); }
          fav.disabled = false; renderFav(); contar();
        };
      }
      // quantos favoritaram / leram
      async function contar() {
        if (!DT.sb) return;
        const { data } = await DT.sb.rpc("contagens", { p_serie: s.id });
        if (!data) return;
        const partes = [];
        if (data.leitores) partes.push(`👁 ${data.leitores} ${data.leitores === 1 ? "leitor" : "leitores"}`);
        if (data.favoritos) partes.push(`♥ ${data.favoritos} ${data.favoritos === 1 ? "favorito" : "favoritos"}`);
        document.getElementById("contagens").textContent = partes.join(" · ");
      }
      contar();
    }
    });
  </script>
  <!-- Cloudflare Web Analytics (contagem anônima de visitas, sem cookies) --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "0950cd16f7fa48d592b6e8d109a58805"}'></script>
</body>
</html>
