<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obra · Dispersion Translations</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <div id="topo"></div>
  <div id="conteudo"></div>
  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const { esc, serie, capa, capsOrdenados, dataBR, lidos, header, footer, store, conta, continuar } = DT;
    document.getElementById("topo").innerHTML = header();
    document.getElementById("rodape").innerHTML = footer();

    DT.iniciar(() => {
    const id = new URLSearchParams(location.search).get("s");
    const s = serie(id);
    const el = document.getElementById("conteudo");

    if (!s) {
      el.innerHTML = `<div class="wrap"><p class="erro-pag">Obra não encontrada. <a href="index.html" style="color:var(--acc)">Voltar ao início</a></p></div>`;
    } else {
      document.title = `${s.titulo} · Dispersion Translations`;
      const caps = capsOrdenados(s);
      const cont = continuar(s);

      el.innerHTML = `
        <div class="serie-topo">
          <div class="fundo" style="background-image:url('${capa(s)}')"></div>
          <div class="wrap">
            <img class="capa-g" src="${capa(s)}" alt="${esc(s.titulo)}" />
            <div>
              <h1>${esc(s.titulo)}</h1>
              ${s.tituloOriginal ? `<div class="original">${esc(s.tituloOriginal)} · ${esc(s.autor || "")}</div>` : ""}
              <div class="tags">
                <span class="tag status">${esc(s.status)}</span>
                ${(s.generos || []).map((g) => `<span class="tag">${esc(g)}</span>`).join("")}
              </div>
              <p class="sinopse">${esc(s.sinopse || "")}</p>
              <div class="botoes">
                ${cont ? `<a class="btn pri" href="ler.html?s=${encodeURIComponent(s.id)}&c=${cont.cap.numero}">${esc(cont.rotulo)}</a>` : ""}
                ${caps.length > 1 ? `<a class="btn" href="ler.html?s=${encodeURIComponent(s.id)}&c=${caps[caps.length - 1].numero}">Último capítulo</a>` : ""}
                ${DT.sb ? `<button class="btn fav" id="fav"></button>` : ""}
              </div>
              <p class="contagens" id="contagens"></p>
            </div>
          </div>
        </div>
        <main class="wrap">
          <section>
            <div class="titulo-sec">
              <h2>Capítulos (${caps.length})</h2>
              <button class="btn ordem" id="ordem"></button>
            </div>
            <div class="lista-caps" id="lista"></div>
          </section>
        </main>`;

      let desc = store.get("ordemDesc", true);
      function renderLista() {
        const l = desc ? [...caps].reverse() : caps;
        document.getElementById("ordem").textContent = desc ? "↓ Mais novos" : "↑ Mais antigos";
        document.getElementById("lista").innerHTML = l.length ? l.map((c) => `
          <a href="ler.html?s=${encodeURIComponent(s.id)}&c=${c.numero}" class="${lidos.foiLido(s.id, c.numero) ? "lido" : ""}">
            <span><span class="n">Capítulo ${c.numero}</span>${c.titulo ? `<span class="t">${esc(c.titulo)}</span>` : ""}</span>
            <span class="d">${dataBR(c.data)}</span>
          </a>`).join("") : `<p class="vazio">Nenhum capítulo ainda. Em breve!</p>`;
      }
      document.getElementById("ordem").onclick = () => { desc = !desc; store.set("ordemDesc", desc); renderLista(); };
      renderLista();

      // favoritar
      const fav = document.getElementById("fav");
      function renderFav() {
        const sim = conta.favoritos.has(s.id);
        fav.classList.toggle("on", sim);
        fav.innerHTML = sim ? "♥ Favoritado" : "♡ Favoritar";
        fav.title = sim ? "Tirar dos favoritos" : "Adicionar à sua biblioteca e ser avisado de capítulos novos";
      }
      if (fav) {
        renderFav();
        fav.onclick = async () => {
          if (!conta.user) return (location.href = conta.linkEntrar());
          fav.disabled = true;
          try { await conta.favoritar(s.id, !conta.favoritos.has(s.id)); } catch (e) { alert("Não deu pra salvar: " + e.message); }
          fav.disabled = false; renderFav(); contar();
        };
      }
      // quantos favoritaram / leram
      async function contar() {
        if (!DT.sb) return;
        const { data } = await DT.sb.rpc("contagens", { p_serie: s.id });
        if (!data) return;
        const partes = [];
        if (data.leitores) partes.push(`👁 ${data.leitores} ${data.leitores === 1 ? "leitor" : "leitores"}`);
        if (data.favoritos) partes.push(`♥ ${data.favoritos} ${data.favoritos === 1 ? "favorito" : "favoritos"}`);
        document.getElementById("contagens").textContent = partes.join(" · ");
      }
      contar();
    }
    });
  </script>
</body>
</html>
