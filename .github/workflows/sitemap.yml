name: Atualizar sitemap

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 6h17 de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ferramentas/sitemap.py
      - name: Salvar se mudou
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Sitemap atualizado"
            git push
          fi
