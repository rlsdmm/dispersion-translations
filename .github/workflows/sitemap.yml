name: Atualizar sitemap e páginas das obras

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ferramentas/sitemap.py
      - run: python ferramentas/obras_estaticas.py
      - name: Salvar se mudou
        run: |
          git add -A sitemap.xml obra
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sitemap e páginas das obras atualizados"
            git push
          fi
