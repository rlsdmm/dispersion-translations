<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leitor · Dispersion Translations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&amp;display=swap" />
  <link rel="stylesheet" href="css/style.css?v=10" />
  <link rel="stylesheet" href="css/temas.css?v=3" />
  <script>try{var t=new URLSearchParams(location.search).get("tema");if(t!==null)localStorage.setItem("tema-previa",t);t=localStorage.getItem("tema-previa");if(t&&t!=="padrao"){document.documentElement.dataset.tema=t;document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&amp;family=Shippori+Mincho:wght@600;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Space+Grotesk:wght@400;600;700&amp;family=Nunito:wght@400;600;800;900&amp;display=swap">')}}catch(e){}</script>
</head>
<body class="leitor">
  <div class="barra-leitor" id="barra">
    <a class="voltar" id="voltar" href="index.html">
      <span class="seta">←</span>
      <div><strong id="tituloSerie">Carregando…</strong><small id="tituloCap"></small></div>
    </a>
    <div class="ctrl">
      <button id="ant" title="Capítulo anterior (Q)">‹ Ant.</button>
      <select id="selCap" title="Escolher capítulo"></select>
      <button id="prox" title="Próximo capítulo (E)">Próx. ›</button>
    </div>
    <div class="ctrl">
      <button id="btnModo" title="Alternar modo de leitura (M)"></button>
      <button id="btnLargura" class="so-desk" title="Largura das páginas"></button>
      <button id="btnDirecao" title="Direção da leitura no modo paginado"></button>
      <button id="btnBalao" title="Mostrar/esconder os comentários passando na tela (C)" hidden></button>
    </div>
  </div>

  <div class="danmaku" id="danmaku" aria-hidden="true"></div>
  <button class="btn-pag-coment" id="btnPagComent" hidden title="Comentários desta página"></button>
  <div class="painel-pag" id="painelPag" hidden>
    <div class="painel-pag-cab"><strong id="painelPagTitulo"></strong><button class="link" id="fecharPag" aria-label="Fechar">✕</button></div>
    <div class="painel-pag-lista" id="painelPagLista"></div>
    <form class="painel-pag-form" id="formPag"></form>
  </div>

  <div class="paginas" id="paginas"></div>

  <div class="fim-cap" id="fimCap"></div>
  <div class="contador" id="contador"></div>
  <div class="progresso" id="progresso"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js?v=2"></script>
  <script src="js/leitor.js?v=5"></script>
</body>
</html>
