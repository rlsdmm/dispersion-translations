<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu pet · Dispersion Translations</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" href="icone-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#070b16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&amp;display=swap" />
  <link rel="stylesheet" href="css/style.css?v=28" />
  <link rel="stylesheet" href="css/temas.css?v=6" />
  <script>try{var q=new URLSearchParams(location.search).get("tema");if(q!==null)localStorage.setItem("dt:tema",JSON.stringify(q));localStorage.removeItem("tema-previa");var t=JSON.parse(localStorage.getItem("dt:tema")||"null");if(t&&t!=="padrao"&&t!=="azul"){document.documentElement.dataset.tema=t;document.write('<link rel="stylesheet" id="fontesTemas" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Space+Grotesk:wght@400;600;700&amp;family=Nunito:wght@400;600;800;900&amp;family=Oswald:wght@500;700&amp;family=Rubik:wght@400;500;700&amp;family=Fredoka:wght@400;500;600;700&amp;display=swap">')}}catch(e){}</script>
</head>
<body>
  <div id="topo"></div>

  <main class="wrap pagina-pet">
    <div class="painel-card login" id="deslogado" hidden>
      <div class="pet-palco pequeno" id="ovoDeslogado"></div>
      <h1>Ganhe um ovinho! 🥚</h1>
      <p class="sub">Crie uma conta grátis, cuide do seu ovo e descubra qual bichinho vai nascer. Tem até pet lendário!</p>
      <a class="btn pri" href="conta.html?volta=pet.html">Entrar ou criar conta</a>
    </div>

    <div id="logado" hidden>
      <section class="pet-card" id="petCard"><p class="sub">Carregando…</p></section>

      <section class="pet-dex">
        <div class="titulo-sec"><h2>Bichinhos que podem nascer</h2></div>
        <p class="sub">O bicho e a cor são sorteados quando o ovo choca. Tem 2% de chance de nascer <b>brilhante ✨</b>.</p>
        <div class="dex" id="dex"></div>
      </section>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/app.js?v=12"></script>
  <script src="js/pets.js?v=3"></script>
  <script>
    const { esc, conta, sb } = DT;
    const $ = (id) => document.getElementById(id);
    $("topo").innerHTML = DT.header("pet");
    $("rodape").innerHTML = DT.footer();
    const CHANCE = { comum: 60, incomum: 25, raro: 12, lendario: 3 };
    const POR_RARIDADE = Object.values(PETS.ESPECIES).reduce((a, [, r]) => ((a[r] = (a[r] || 0) + 1), a), {});
    const estagio = (calor) => (calor >= 100 ? 3 : calor >= 70 ? 2 : calor >= 35 ? 1 : 0);
    const espera = (ms) => new Promise((r) => setTimeout(r, ms));

    DT.iniciar(async () => {
      if (!sb || !conta.user) {
        $("ovoDeslogado").innerHTML = PETS.desenharOvo(1, 210);
        $("deslogado").hidden = false;
        return;
      }
      $("logado").hidden = false;
      const hue = PETS.corOvo(conta.user.id);
      let pet = (await sb.rpc("meu_pet")).data;
      const msg = (id, t, tipo) => { $(id).innerHTML = t; $(id).className = "msg " + tipo; };
      let humorForcado = null;
      render();

      function renderDex() {
        $("dex").innerHTML = Object.entries(PETS.ESPECIES).map(([id, [nome, rar]]) => {
          const meu = pet?.especie === id;
          const [rnome, rcor] = PETS.RARIDADES[rar];
          const chance = (CHANCE[rar] / POR_RARIDADE[rar]).toLocaleString("pt-BR", { maximumFractionDigits: 1 });
          return `<div class="dex-item ${meu ? "meu" : ""}">
            <div class="dex-img">${PETS.desenharPet({ especie: id, cor: meu ? pet.cor : 210, brilhante: meu && pet.brilhante }, meu ? "" : "silhueta")}</div>
            <b>${meu ? nome : "???"}</b>
            <small style="color:${rcor}">${rnome} · ${chance}%</small>
          </div>`;
        }).join("");
      }

      function render() {
        renderDex();
        if (!pet) { $("petCard").innerHTML = `<p class="msg erro">Não deu pra carregar seu pet. Tente recarregar a página.</p>`; return; }
        if (!pet.nasceu_em) return renderOvo();
        renderPet();
      }

      function renderOvo() {
        const c = pet.calor, pronto = c >= 100;
        const falta = Math.max(0, 100 - c);
        $("petCard").innerHTML = `
          <div class="pet-palco" id="palco">${PETS.desenharOvo(estagio(c), hue)}</div>
          <div class="pet-lado">
            <h1>${pronto ? "O ovo está rachando! 🐣" : "Seu ovinho"}</h1>
            <p class="sub">${pronto ? "Ele está pronto pra nascer. Toque no botão pra chocar!"
              : "Mantenha o ovo quentinho pra ele chocar. Ninguém sabe o que tem aí dentro…"}</p>
            <div class="calor">
              <div class="calor-topo"><b>🔥 Calor</b><span>${c}/100</span></div>
              <div class="xp-barra calor-barra"><div style="width:${c}%"></div></div>
            </div>
            <button class="btn pri grande" id="btnAquecer" ${pet.aqueceu_hoje && !pronto ? "disabled" : ""}>
              ${pronto ? "🐣 Chocar o ovo!" : pet.aqueceu_hoje ? "✓ Já aqueceu hoje" : "🔥 Aquecer o ovo (+15)"}</button>
            <ul class="como-aquecer">
              <li><b>+15</b> por dia que você aquece o ovo (1 vez por dia) <span class="sub">· ${pet.dias} ${pet.dias === 1 ? "dia" : "dias"}</span></li>
              <li><b>+10</b> por capítulo que você termina de ler <span class="sub">· ${pet.caps} ${pet.caps === 1 ? "capítulo" : "capítulos"}</span></li>
            </ul>
            ${!pronto ? `<p class="sub">Faltam <b>${falta}</b> de calor: dá pra chocar lendo ${Math.ceil(falta / 10)} ${Math.ceil(falta / 10) === 1 ? "capítulo" : "capítulos"}. <a class="link" href="index.html#obras">Ir ler →</a></p>` : ""}
          </div>`;
        $("btnAquecer").onclick = aquecer;
      }

      async function aquecer() {
        const b = $("btnAquecer"); b.disabled = true;
        const ovo = $("palco").querySelector(".ovo-svg");
        ovo.classList.add("chocando");
        const [r] = await Promise.all([sb.rpc("aquecer_ovo"), espera(900)]);
        ovo.classList.remove("chocando");
        if (r.error) { b.disabled = false; return alert("Não deu: " + r.error.message); }
        pet = r.data;
        if (!pet.nasceu_agora) return render();
        // nascimento!
        $("palco").innerHTML = PETS.desenharOvo(3, hue, "chocando");
        await espera(1600);
        $("palco").classList.add("flash");
        await espera(350);
        renderPet(true);
        renderDex();
      }

      function renderPet(nasceuAgora = false) {
        const [nome, rar, desc] = PETS.ESPECIES[pet.especie] || ["?", "comum", ""];
        const [rnome, rcor] = PETS.RARIDADES[rar];
        const nasc = new Date(pet.nasceu_em).toLocaleDateString("pt-BR");
        $("petCard").innerHTML = `
          <div class="pet-palco ${nasceuAgora ? "revela" : ""}" id="palco" title="Fazer carinho"></div>
          <div class="pet-lado">
            ${nasceuAgora ? `<p class="nasceu">🎉 Nasceu!</p>` : ""}
            <h1>${esc(pet.nome || nome)}</h1>
            <div class="pet-tags">
              <span class="pet-rar" style="--rc:${rcor}">${rnome}</span>
              <span class="pet-esp">${nome}</span>
              ${pet.brilhante ? `<span class="pet-rar brilho" style="--rc:#fde68a">✨ Brilhante</span>` : ""}
            </div>
            <div id="statusPet"></div>
            <div class="pet-comida">
              <div class="pc-topo"><b>🍱 Petiscos: <span id="nPetiscos"></span></b><button type="button" class="btn mini-btn" id="btnPresente"></button></div>
              <div class="bandeja">${Object.entries(PETS.COMIDAS).map(([id, [e, n]]) => `
                <button type="button" class="comida" data-comida="${id}" title="Dar ${n}"><span>${e}</span><small>${n}</small></button>`).join("")}</div>
              <p class="sub">Cada capítulo que você termina vale <b>1 petisco</b>, e tem 1 de presente por dia. Cada pet tem uma comida favorita… descubra qual! 👀</p>
              <p class="msg" id="msgComida"></p>
            </div>
            <div class="pet-comida guarda-roupa">
              <div class="pc-topo"><b>👗 Guarda-roupa</b><small class="sub" id="nLiberados"></small></div>
              <div class="gr-linha"><small>Cabeça</small><div class="gr-itens" id="grCabeca"></div></div>
              <div class="gr-linha"><small>Rosto e pescoço</small><div class="gr-itens" id="grRosto"></div></div>
              <p class="msg" id="msgRoupa"></p>
            </div>
            <details class="pet-sobre">
              <summary>Sobre ${esc(pet.nome || nome)} e nome</summary>
              <p>${desc}</p>
              <p class="sub">Nasceu em ${nasc}. Aparece no seu <a class="link" href="${DT.linkPerfil(conta.user.id)}">perfil</a>.</p>
              <form class="pet-nome" id="formNome">
                <label>${pet.nome ? "Nome do pet" : "Dê um nome pro seu pet!"}
                  <input type="text" id="nomePet" maxlength="20" value="${esc(pet.nome || "")}" placeholder="ex: ${nome}" /></label>
                <button class="btn" type="submit">Salvar nome</button>
              </form>
              <p class="msg" id="msgNome"></p>
            </details>
          </div>`;
        if (!pet.nome || nasceuAgora) $("petCard").querySelector(".pet-sobre").open = true;
        renderStatus();
        renderRoupas();

        $("palco").onclick = async (e) => {
          coracao(e);
          pular();
          const antes = pet.carinhos_hoje || 0;
          const { data } = await sb.rpc("carinho_pet");
          if (data) {
            pet = data; renderStatus();
            if (antes >= 5) msg("msgComida", `${esc(pet.nome || nome)} adora carinho! (a felicidade extra vale até 5 carinhos por dia)`, "");
          }
        };
        $("btnPresente").onclick = async () => {
          $("btnPresente").disabled = true;
          const { data, error } = await sb.rpc("presente_pet");
          if (error) return msg("msgComida", "Não deu: " + esc(error.message), "erro");
          pet = data; renderStatus(); msg("msgComida", "🎁 +1 petisco! Volte amanhã pra pegar outro.", "ok");
        };
        $("petCard").querySelectorAll(".comida").forEach((b) => (b.onclick = () => alimentar(b)));
        $("formNome").onsubmit = async (e) => {
          e.preventDefault();
          const n = $("nomePet").value.trim();
          const { error } = await sb.rpc("nomear_pet", { p_nome: n });
          if (error) return msg("msgNome", "Não deu pra salvar: " + esc(error.message), "erro");
          pet.nome = n || null;
          $("petCard").querySelector(".pet-lado h1").textContent = n || nome;
          msg("msgNome", "Nome salvo! 💕", "ok");
        };
      }


      // barras, humor e botões (sem redesenhar a página toda)
      function renderStatus() {
        const humor = humorForcado || PETS.humorDe(pet);
        const [he, hn] = PETS.HUMORES[humor];
        const corBarra = (v) => (v < 20 ? "#f87171" : v < 50 ? "#fbbf24" : "#34d399");
        const svgAtual = $("palco").querySelector(".pet-svg");
        if (!svgAtual || !svgAtual.classList.contains("humor-" + humor)) {
          if (svgAtual) svgAtual.remove();
          $("palco").insertAdjacentHTML("afterbegin", PETS.desenharPet(pet, "", humor));
        }
        const dica = humor === "fome" ? "Tá com fome! Dá uma comidinha 🍙"
          : humor === "triste" ? "Tá carente… faz um carinho ou dá a comida favorita."
          : humor === "dormindo" ? "Shhh… tá dormindo. Dá pra cuidar mesmo assim."
          : humor === "radiante" ? "Super feliz com você! 💕" : "Tranquilo e de barriguinha cheia.";
        $("statusPet").innerHTML = `
          <div class="pet-humor"><span>${he}</span><div><b>${hn}</b><small>${dica}</small></div></div>
          <div class="barra-pet"><span>🍙 Barriga</span><div class="xp-barra"><div style="width:${pet.saciedade}%;background:${corBarra(pet.saciedade)}"></div></div><b>${pet.saciedade}</b></div>
          <div class="barra-pet"><span>💖 Felicidade</span><div class="xp-barra"><div style="width:${pet.felicidade}%;background:${corBarra(pet.felicidade)}"></div></div><b>${pet.felicidade}</b></div>
          <p class="sub dica-carinho">💡 Clique no pet pra fazer carinho <span>(${Math.min(5, pet.carinhos_hoje || 0)}/5 hoje)</span></p>`;
        $("nPetiscos").textContent = pet.petiscos;
        $("btnPresente").disabled = pet.presente_hoje;
        $("btnPresente").textContent = pet.presente_hoje ? "🎁 Presente de hoje já pego" : "🎁 Pegar presente do dia";
        $("petCard").querySelectorAll(".comida").forEach((b) => (b.disabled = pet.petiscos < 1));
      }

      // guarda-roupa: liberados dá pra vestir/tirar; bloqueados mostram como liberar
      function renderRoupas() {
        const lib = new Set(pet.liberados || []);
        const total = Object.keys(PETS.ACESSORIOS).length;
        $("nLiberados").textContent = `${lib.size} de ${total} liberados`;
        const item = ([id, [emoji, nome, slot, como]]) => {
          const vestido = pet[slot === "cabeca" ? "acessorio_cabeca" : "acessorio_rosto"] === id;
          return lib.has(id)
            ? `<button type="button" class="gr-item ${vestido ? "on" : ""}" data-slot="${slot}" data-item="${id}" title="${vestido ? "Tirar" : "Vestir"} ${nome}"><span>${emoji}</span><small>${nome}</small></button>`
            : `<button type="button" class="gr-item travado" data-como="${esc(como)}" data-nome="${esc(nome)}" title="${esc(como)}"><span>${emoji}</span><small>🔒 ${nome}</small></button>`;
        };
        const lista = Object.entries(PETS.ACESSORIOS);
        $("grCabeca").innerHTML = lista.filter(([, a]) => a[2] === "cabeca").map(item).join("");
        $("grRosto").innerHTML = lista.filter(([, a]) => a[2] === "rosto").map(item).join("");
        $("petCard").querySelectorAll(".gr-item").forEach((b) => (b.onclick = () => vestir(b)));
      }
      async function vestir(b) {
        if (b.classList.contains("travado")) return msg("msgRoupa", `🔒 <b>${b.dataset.nome}</b>: ${b.dataset.como}.`, "");
        const slot = b.dataset.slot, item = b.classList.contains("on") ? null : b.dataset.item;
        $("petCard").querySelectorAll(".gr-item").forEach((x) => (x.disabled = true));
        const { data, error } = await sb.rpc("vestir_pet", { p_slot: slot, p_item: item });
        if (error) { renderRoupas(); return msg("msgRoupa", "Não deu: " + esc(error.message), "erro"); }
        pet = data;
        $("palco").querySelector(".pet-svg")?.remove();
        renderStatus(); renderRoupas(); pular();
        msg("msgRoupa", item ? `${PETS.ACESSORIOS[item][0]} Ficou lindo!` : "Tirou o acessório.", "ok");
      }

      function pular() {
        const svg = $("palco").querySelector(".pet-svg");
        svg.classList.remove("feliz"); void svg.getBoundingClientRect(); svg.classList.add("feliz");
      }
      function coracao(e, txt) {
        const c = document.createElement("span");
        c.className = "coracao-pet"; c.textContent = txt || ["💖", "💕", "✨", "💗"][Math.floor(Math.random() * 4)];
        const r = $("palco").getBoundingClientRect();
        const x = e ? e.clientX - r.left : r.width / 2, y = e ? e.clientY - r.top : r.height / 3;
        c.style.left = x - 10 + "px"; c.style.top = y - 20 + "px";
        $("palco").appendChild(c); setTimeout(() => c.remove(), 1300);
      }

      async function alimentar(botao) {
        const id = botao.dataset.comida, [emoji, nomeC] = PETS.COMIDAS[id];
        $("petCard").querySelectorAll(".comida").forEach((b) => (b.disabled = true));
        const { data, error } = await sb.rpc("alimentar_pet", { p_comida: id });
        if (error) {
          renderStatus();
          return msg("msgComida", /cheio/.test(error.message) ? "Tá cheinho! Espera a barriga baixar um pouco. 😴"
            : /petisco/.test(error.message) ? "Sem petiscos: leia um capítulo ou pegue o presente do dia." : "Não deu: " + esc(error.message), "erro");
        }
        // a comidinha voa até o pet
        const de = botao.getBoundingClientRect(), ate = $("palco").getBoundingClientRect();
        const voa = Object.assign(document.createElement("span"), { className: "comida-voando", textContent: emoji });
        voa.style.left = de.left + de.width / 2 - 16 + "px"; voa.style.top = de.top + "px";
        document.body.appendChild(voa);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          voa.style.transform = `translate(${ate.left + ate.width / 2 - de.left - de.width / 2}px, ${ate.top + ate.height * 0.55 - de.top}px) scale(.4)`;
          voa.style.opacity = ".2";
        }));
        await espera(650); voa.remove();
        pet = data;
        humorForcado = "radiante"; renderStatus(); pular();
        coracao(null, data.favorita ? "❤️" : "😋");
        msg("msgComida", data.favorita ? `❤️ <b>${nomeC}</b> é a comida favorita! Ganhou felicidade em dobro.` : `Nham! ${emoji} Que delícia.`, "ok");
        setTimeout(() => { humorForcado = null; renderStatus(); }, 2500);
      }
    });
  </script>

</body>
</html>
